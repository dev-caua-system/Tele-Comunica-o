<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#111111"> <title>Comunicador</title> <link rel="stylesheet" href="style.css"> </head> <body> <main class="container"> <section class="card"> <div class="icon">💬</div> <h1>Comunicador</h1> <p class="descricao"> Hello bom dia, boa tarde e boa noite:D. <br> Se precisar falar comigo, deixe uma mensagem aqui. </p> <form action="https://formspree.io/f/mzdazbke" method="POST" class="message-form" > <!-- NOME/APELIDO --> <label for="nome"> Nome/apelido <span>(opcional)</span> </label> <input type="text" id="nome" name="nome" placeholder="Como posso te chamar?" > <!-- ASSUNTO --> <label for="assunto"> Assunto <span>(opcional)</span> </label> <select id="assunto" name="assunto"> <option value=""> Selecione uma opção </option> <option value="Contato"> Contato </option> <option value="Emergência"> Emergência </option> </select> <!-- MENSAGEM --> <label for="mensagem"> Mensagem </label> <textarea id="mensagem" name="mensagem" rows="7" placeholder="Escreva sua mensagem..." required ></textarea> <!-- BOTÃO --> <button type="submit" class="button"> Enviar mensagem </button> </form> <p class="aviso"> Sua mensagem será enviada diretamente para mim por e-mail. </p> </section> </main> </body> </html>
